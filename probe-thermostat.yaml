esphome:
  name: thermometer-pool
  friendly_name: Termòmetre piscina
  # board: esp32dev

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_name
  password: !secret wifi_pass
  fast_connect: false

logger:
  level: VERBOSE

api:
  encryption:
    key: !secret key

ota:
  platform: esphome

#
one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    name: "DS18B20 Temperature"
    resolution: 12

# deep sleep to reduce power consumption
deep_sleep:
  run_duration: 15s
  sleep_duration: 10min
